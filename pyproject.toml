[project]
name = "feishu-codex-bridge"
version = "0.1.0"
description = "飞书远程控制 Codex 桥接服务"
requires-python = ">=3.10"
dependencies = [
    "lark-oapi>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
feishu-codex-bridge = "feishu_codex_bridge.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
